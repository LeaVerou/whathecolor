<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="utf-8" />
<title>What the color? - A color game for web developers!</title>
<link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text y=".9em" font-size="90">🎨</text></svg>'>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css" />
<script src="importmap.js"></script>
<script type="module" src="index.js"></script>

</head>
<body v-cloak>

<h1>
	What the <span>color?</span>
</h1>

<main>
	<p class="timer">{{ timer }}</p>

	<color-board
		:target="solution"
		:guess="guessColor"
		:proximity="proximity"
		:delta-e="deltaE"
		:solved="solved"></color-board>

	<div class="controls">
		<color-picker ref="picker" space="oklch" :inert="solved" @input="onPick"></color-picker>
		<progression :displays="displays"></progression>
	</div>

	<p class="message success" :class="{ show: solved }" role="status" aria-live="polite">
		Yay! You got it!
		<a href="#" @click.prevent="newRound">Next</a>
	</p>

	<p class="message slow" :class="{ show: showSlow }" role="status" aria-live="polite">
		Looks like this color is taking you a bit long. Wanna skip it?
		<a href="#" @click.prevent="skip">Skip</a>
	</p>


</main>

<history-panel :history="history"></history-panel>

<footer>
	Made with ❤️ by <a href="http://lea.verou.me">Lea Verou</a> using <a href="https://colorjs.io">Color.js</a>
	&bull; <a href="https://github.com/LeaVerou/whathecolor" target="_blank">Github</a>
</footer>

</body>
</html>
